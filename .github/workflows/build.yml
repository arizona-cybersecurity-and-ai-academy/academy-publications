name: Build publications page

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 06:00 Arizona
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build from Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "academy-publications-bot"
          git config user.email "actions@users.noreply.github.com"
          # The generated stamp changes every run; ignore it when deciding whether anything real changed.
          if git diff --quiet -I 'Generated [0-9-]+ from' -- docs; then
            echo "no change"; exit 0
          fi
          git add docs
          git commit -m "Update publications list ($(date -u +%Y-%m-%d))"
          git push
